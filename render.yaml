services:
  - type: web
    name: barberconnect
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barberconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: STATIC_DIR
        value: /app/backend/public

databases:
  - name: barberconnect-db
    databaseName: barberconnect
    user: barberconnect
